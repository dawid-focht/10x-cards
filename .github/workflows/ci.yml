name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Akcje przypięte do SHA, nie do ruchomego tagu: `@v7` może jutro wskazywać
      # inny kod, a ten kod wykonuje się na runnerze z dostępem do sekretów.
      # Komentarz obok SHA trzyma czytelność — wersję widać bez chodzenia do API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7 działa na node24. Poprzednie v4 celowały w node20 i runner wymuszał
      # na nich node24, wypisując adnotację o deprecacji przy każdym przebiegu.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          MOCK_AI: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          MOCK_AI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/

  # Osobny job, bo `ai-review` to niezależna paczka z własnym tsconfigiem i
  # własnymi zależnościami — korzeniowe `npm ci` ich nie instaluje, a
  # `astro check` świadomie ją wyklucza (inny runtime, importy z rozszerzeniem
  # .ts, verbatimModuleSyntax). Bez tego joba `schema.test.ts` — jedyne, co
  # pilnuje progów bramki review — nie jest uruchamiane nigdzie, więc regresja
  # progu przechodziłaby przy zielonym CI.
  ai-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # 47 asercji offline: kształt schematu, rubryki w opisach pól i przypadki
      # brzegowe bramki (dokładnie 3, dokładnie 5 na kryterium krytycznym,
      # średnia dokładnie 7.0). Zero sieci — nie potrzebuje klucza.
      - name: Testy schematu i bramki
        run: npm test
