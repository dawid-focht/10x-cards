name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Akcje przypięte do SHA, nie do ruchomego tagu: `@v7` może jutro wskazywać
      # inny kod, a ten kod wykonuje się na runnerze z dostępem do sekretów.
      # Komentarz obok SHA trzyma czytelność — wersję widać bez chodzenia do API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7 działa na node24. Poprzednie v4 celowały w node20 i runner wymuszał
      # na nich node24, wypisując adnotację o deprecacji przy każdym przebiegu.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          MOCK_AI: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          MOCK_AI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
